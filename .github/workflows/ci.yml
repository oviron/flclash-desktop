name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  GOVULNCHECK_VERSION: 'v1.10.0'

jobs:
  # The whole history, every run: the repository is small, and a range picked
  # from a pull request's pages can miss commits.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  # One job per OS keeps a single warm GOCACHE across vet, tests, app build and
  # govulncheck instead of repeating setup and cache restore on separate runners.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: go-ci-linux-${{ env.GO_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-linux-${{ env.GO_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-
            go-ci-linux-${{ env.GO_VERSION }}-
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go test (-race)
        run: go test -race ./...
      # govulncheck for the Windows builds runs on Linux in a few seconds.
      - name: govulncheck (windows/amd64, arm64)
        run: |
          bin="$(go env GOPATH)/bin/govulncheck"
          if [ ! -x "$bin" ]; then
            go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          fi
          GOOS=windows GOARCH=amd64 "$bin" -tags no_easytier,no_zerotier ./...
          GOOS=windows GOARCH=arm64 "$bin" -tags no_easytier,no_zerotier ./...

  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/go/bin
          key: go-ci-macos-${{ env.GO_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-macos-${{ env.GO_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-
            go-ci-macos-${{ env.GO_VERSION }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.build
          key: swift-macos-${{ hashFiles('macos/Package.swift', 'macos/Sources/**') }}
          restore-keys: swift-macos-
      - run: go vet ./...
      # The Linux job already runs -race on every shared package; here we run
      # all tests and keep -race for the darwin-specific helper code without
      # rebuilding mihomo with race instrumentation on macOS.
      - name: go test
        run: |
          go test ./...
          go test -race ./internal/helper/...
      # The macOS app links the engine through cgo (./bridge), so darwin is
      # scanned on a Mac.
      - name: govulncheck (darwin/arm64)
        run: |
          bin="$(go env GOPATH)/bin/govulncheck"
          if [ ! -x "$bin" ]; then
            go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          fi
          GOOS=darwin GOARCH=arm64 "$bin" -tags no_easytier,no_zerotier ./...
      - run: make -j4 app
      - name: Check the bundle
        run: |
          codesign --verify --deep --strict dist/FlClash.app
          plutil -p dist/FlClash.app/Contents/Info.plist | grep -E 'CFBundle(ShortVersionString|Version)'
          dist/FlClash.app/Contents/MacOS/flclashctl version
      # The app starts, stays up and quits; it changes nothing until asked.
      - name: Start the app
        run: |
          dist/FlClash.app/Contents/MacOS/FlClash &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
            ~/go/bin
          key: go-ci-windows-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-ci-windows-${{ env.GO_VERSION }}-
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('windows/FlClash.Window/FlClash.Window.csproj') }}
          restore-keys: nuget-windows-
      - run: go vet ./...
      - run: go test ./...
      - run: windows\build.ps1 -Arch x64
        shell: pwsh
      - name: Check the build
        shell: pwsh
        run: |
          $dir = 'dist\windows\FlClash'
          foreach ($f in 'FlClash.exe', 'flclash-core.exe', 'flclash-helper.exe', 'flclashctl.exe', 'window\FlClash.Window.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          & "$dir\flclashctl.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'flclashctl does not run' }
      # The installer is built here too, so a mistake in it shows before a tag.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $iscc = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup did not install' }
          }
          & $iscc /Qp /DArch=x64 "/DSource=$PWD\dist\windows\FlClash" "/DOutput=$PWD\out" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'the installer did not build' }
