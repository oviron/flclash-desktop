name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27'

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi

  # govulncheck follows the calls of the builds that ship. The macOS app links
  # the engine through cgo (./bridge), so darwin is scanned on a Mac.
  vuln:
    name: vuln (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-26, goos: darwin, goarch: arm64}
          - {os: ubuntu-latest, goos: windows, goarch: amd64}
          - {os: ubuntu-latest, goos: windows, goarch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Pinned so a new release cannot demand a newer toolchain unseen.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: '"$(go env GOPATH)/bin/govulncheck" -tags no_easytier,no_zerotier ./...'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  # The whole history, every run: the repository is small, and a range picked
  # from a pull request's pages can miss commits.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  macos-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: make app
      - name: Check the bundle
        run: |
          codesign --verify --deep --strict dist/FlClash.app
          plutil -p dist/FlClash.app/Contents/Info.plist | grep -E 'CFBundle(ShortVersionString|Version)'
          dist/FlClash.app/Contents/MacOS/flclashctl version
      # The app starts, stays up and quits; it changes nothing until asked.
      - name: Start the app
        run: |
          dist/FlClash.app/Contents/MacOS/FlClash &
          pid=$!
          sleep 8
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true

  windows-app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: windows\build.ps1 -Arch x64
        shell: pwsh
      - name: Check the build
        shell: pwsh
        run: |
          $dir = 'dist\windows\FlClash'
          foreach ($f in 'FlClash.exe', 'flclash-core.exe', 'flclash-helper.exe', 'flclashctl.exe', 'window\FlClash.Window.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          & "$dir\flclashctl.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'flclashctl does not run' }
      # The installer is built here too, so a mistake in it shows before a tag.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $iscc = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup did not install' }
          }
          & $iscc /Qp /DArch=x64 "/DSource=$PWD\dist\windows\FlClash" "/DOutput=$PWD\out" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'the installer did not build' }
