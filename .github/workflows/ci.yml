name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27'

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Pinned so a new release cannot demand a newer toolchain unseen. The
      # shipped binaries are for macOS and Windows: scan those builds.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: govulncheck (darwin)
        run: GOOS=darwin GOARCH=arm64 "$(go env GOPATH)/bin/govulncheck" -tags with_gvisor ./...
      - name: govulncheck (windows)
        run: GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/govulncheck" -tags with_gvisor ./...

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: make app
      - name: Check the bundle
        run: |
          codesign --verify --deep --strict dist/FlClash.app
          plutil -p dist/FlClash.app/Contents/Info.plist | grep -E 'CFBundle(ShortVersionString|Version)'
          dist/FlClash.app/Contents/MacOS/flclashctl version
      # The app starts, stays up and quits; it changes nothing until asked.
      - name: Start the app
        run: |
          dist/FlClash.app/Contents/MacOS/FlClash &
          pid=$!
          sleep 8
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true

  windows-app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: windows\build.ps1 -Arch x64
        shell: pwsh
      - name: Check the build
        shell: pwsh
        run: |
          $dir = 'dist\windows\FlClash'
          foreach ($f in 'FlClash.exe', 'flclash-core.exe', 'flclash-helper.exe', 'flclashctl.exe', 'window\FlClash.Window.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          & "$dir\flclashctl.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'flclashctl does not run' }
