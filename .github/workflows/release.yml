name: release

# A v* tag builds the app for macOS and Windows and publishes it as a GitHub
# release: archives, installers, their SHA-256 sums, a build provenance
# attestation for each file and, when the key is set up, a GPG signature of the
# sums.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GO_VERSION: '1.27'

jobs:
  # A version the file versions and the installer can carry: X.Y.Z, or
  # X.Y.Z-something for a pre-release.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-PRERELEASE"; exit 1
          fi

  macos:
    needs: tag
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          make app VERSION="$version"
          codesign --verify --deep --strict dist/FlClash.app
          test "$(dist/FlClash.app/Contents/MacOS/flclashctl version)" = "$version"
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out dmg
          ditto -c -k --keepParent dist/FlClash.app "out/FlClash-$version-macos-arm64.zip"
          ditto dist/FlClash.app dmg/FlClash.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname FlClash -srcfolder dmg -fs HFS+ -format UDZO \
            "out/FlClash-$version-macos-arm64.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  windows:
    needs: tag
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          windows\build.ps1 -Arch ${{ matrix.arch }} -Version $version
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $short = ($version -split '-')[0]
          New-Item -ItemType Directory -Force out | Out-Null
          # The portable copy: the same files and the mark that keeps the
          # data in a folder beside them.
          $portable = 'portable\FlClash'
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item -Recurse dist\windows\FlClash\* $portable
          Copy-Item windows\portable.txt "$portable\portable"
          Compress-Archive -Path $portable -DestinationPath "out\FlClash-$version-windows-${{ matrix.arch }}-portable.zip"
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $iscc = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup did not install' }
          }
          & $iscc /Qp "/DVersion=$version" "/DFileVersion=$short" "/DArch=${{ matrix.arch }}" `
            "/DSource=$PWD\dist\windows\FlClash" "/DOutput=$PWD\out" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'the installer did not build' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum FlClash-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS
      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign the checksums
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: out
        run: gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "CHANGELOG.md has no notes for $version"; exit 1; fi
          cat >> notes.md <<'NOTES'

          The builds are not signed by Apple or Microsoft yet. See [Installing](https://github.com/oviron/flclash-desktop#installing) for the first start and how to check that a file is the one built here.
          NOTES
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: out/*
          fail_on_unmatched_files: true
